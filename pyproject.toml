[project]
name = "mini-gpt-from-scratch"
version = "1.0.0"
description = "A small GPT written from scratch: BPE tokenizer, causal self-attention, training and sampling"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # SQL strings and test tables read better unwrapped
